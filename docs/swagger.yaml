basePath: /api/v1
definitions:
  github_com_vitaly-bogdanov_my-todo-app_internal_core_transport_http_response.ErrorResponse:
    properties:
      error:
        example: full error text
        type: string
      message:
        example: short human readable error message
        type: string
    type: object
  internal_features_statistics_transport_http.GetStatisticsResponseDTO:
    properties:
      tasks_average_completation_time:
        type: string
      tasks_completed:
        type: integer
      tasks_completed_rate:
        type: number
      tasks_created:
        type: integer
    type: object
  internal_features_tasks_transport_http.CreateTaskRequestDTO:
    properties:
      author_user_id:
        type: integer
      description:
        maxLength: 1000
        minLength: 1
        type: string
      title:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - author_user_id
    - title
    type: object
  internal_features_tasks_transport_http.CreateTaskResponseDTO:
    properties:
      author_user_id:
        type: integer
      completed:
        type: boolean
      completed_at:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      title:
        type: string
      version:
        type: integer
    type: object
  internal_features_tasks_transport_http.GetTaskResponse:
    properties:
      author_user_id:
        type: integer
      completed:
        type: boolean
      completed_at:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      title:
        type: string
      version:
        type: integer
    type: object
  internal_features_tasks_transport_http.PatchTaskRequestDTO:
    properties:
      completed:
        example: true
        type: boolean
      description:
        example: 2 liters
        type: string
      title:
        example: Buy milk
        type: string
    type: object
  internal_features_tasks_transport_http.PatchTaskResponseDTO:
    properties:
      author_user_id:
        type: integer
      completed:
        type: boolean
      completed_at:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      title:
        type: string
      version:
        type: integer
    type: object
  internal_features_tasks_transport_http.TaskDTO:
    properties:
      author_user_id:
        type: integer
      completed:
        type: boolean
      completed_at:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      title:
        type: string
      version:
        type: integer
    type: object
  internal_features_users_transport_http.CreateUserRequestDTO:
    properties:
      full_name:
        example: John Doe
        maxLength: 100
        minLength: 1
        type: string
      phone_number:
        example: "+1234567890"
        type: string
    required:
    - full_name
    type: object
  internal_features_users_transport_http.CreateUserResponseDTO:
    properties:
      full_name:
        example: John Doe
        type: string
      id:
        example: 1
        type: integer
      phone_number:
        example: "+1234567890"
        type: string
      version:
        example: 1
        type: integer
    type: object
  internal_features_users_transport_http.GetUserRequestDTO:
    properties:
      full_name:
        example: John Doe
        type: string
      id:
        example: 1
        type: integer
      phone_number:
        example: "+1234567890"
        type: string
      version:
        example: 1
        type: integer
    type: object
  internal_features_users_transport_http.PatchUserRequestDTO:
    properties:
      full_name:
        example: John Doe
        type: string
      phone_number:
        example: "+1234567890"
        type: string
    type: object
  internal_features_users_transport_http.PatchUserResponseDTO:
    properties:
      full_name:
        example: John Doe
        type: string
      id:
        example: 1
        type: integer
      phone_number:
        example: "+1234567890"
        type: string
      version:
        example: 1
        type: integer
    type: object
  internal_features_users_transport_http.UserDTO:
    properties:
      full_name:
        example: John Doe
        type: string
      id:
        example: 1
        type: integer
      phone_number:
        example: "+1234567890"
        type: string
      version:
        example: 1
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: Todo App API
  title: Todo App API
  version: "1.0"
paths:
  /statistics:
    get:
      description: Get task statistics. from and to are dates in YYYY-MM-DD. If both
        are set, to must be after from.
      parameters:
      - description: Author user ID
        in: query
        name: user_id
        type: integer
      - description: Start date, YYYY-MM-DD
        in: query
        name: from
        type: string
      - description: End date, YYYY-MM-DD
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Statistics
          schema:
            $ref: '#/definitions/internal_features_statistics_transport_http.GetStatisticsResponseDTO'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_vitaly-bogdanov_my-todo-app_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_vitaly-bogdanov_my-todo-app_internal_core_transport_http_response.ErrorResponse'
      summary: Get statistics
      tags:
      - statistics
  /tasks:
    get:
      description: Get tasks list. Optional user_id filters by author. Total count
        is returned in X-Total-Count.
      parameters:
      - description: Author user ID
        in: query
        name: user_id
        type: integer
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Tasks list
          headers:
            X-Total-Count:
              description: Total number of tasks
              type: integer
          schema:
            items:
              $ref: '#/definitions/internal_features_tasks_transport_http.TaskDTO'
            type: array
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_vitaly-bogdanov_my-todo-app_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_vitaly-bogdanov_my-todo-app_internal_core_transport_http_response.ErrorResponse'
      summary: Get tasks list
      tags:
      - tasks
    post:
      consumes:
      - application/json
      description: Create a task with title, optional description and author user
        id
      parameters:
      - description: Task creation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_tasks_transport_http.CreateTaskRequestDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Task created successfully
          schema:
            $ref: '#/definitions/internal_features_tasks_transport_http.CreateTaskResponseDTO'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_vitaly-bogdanov_my-todo-app_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Author not found
          schema:
            $ref: '#/definitions/github_com_vitaly-bogdanov_my-todo-app_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_vitaly-bogdanov_my-todo-app_internal_core_transport_http_response.ErrorResponse'
      summary: Create a new task
      tags:
      - tasks
  /tasks/{id}:
    delete:
      description: Delete task by ID
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No content
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_vitaly-bogdanov_my-todo-app_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/github_com_vitaly-bogdanov_my-todo-app_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_vitaly-bogdanov_my-todo-app_internal_core_transport_http_response.ErrorResponse'
      summary: Delete task
      tags:
      - tasks
    get:
      description: Get task by ID
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Task found
          schema:
            $ref: '#/definitions/internal_features_tasks_transport_http.GetTaskResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_vitaly-bogdanov_my-todo-app_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/github_com_vitaly-bogdanov_my-todo-app_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_vitaly-bogdanov_my-todo-app_internal_core_transport_http_response.ErrorResponse'
      summary: Get task
      tags:
      - tasks
    patch:
      description: |-
        Patch task by ID

        В теле можно передать любое сочетание полей:
        - title, от 1 до 100 символов, null нельзя
        - description, от 1 до 1000 символов, либо null чтобы очистить
        - completed, true или false, null нельзя
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: integer
      - description: Task patch
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_tasks_transport_http.PatchTaskRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Task patched
          schema:
            $ref: '#/definitions/internal_features_tasks_transport_http.PatchTaskResponseDTO'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_vitaly-bogdanov_my-todo-app_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/github_com_vitaly-bogdanov_my-todo-app_internal_core_transport_http_response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_vitaly-bogdanov_my-todo-app_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_vitaly-bogdanov_my-todo-app_internal_core_transport_http_response.ErrorResponse'
      summary: Patch task
      tags:
      - tasks
  /users:
    get:
      description: Get users list
      parameters:
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Users list
          schema:
            items:
              $ref: '#/definitions/internal_features_users_transport_http.UserDTO'
            type: array
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_vitaly-bogdanov_my-todo-app_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_vitaly-bogdanov_my-todo-app_internal_core_transport_http_response.ErrorResponse'
      summary: Get users list
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Create a new user with the given full name and phone number
      parameters:
      - description: User creation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_users_transport_http.CreateUserRequestDTO'
      produces:
      - application/json
      responses:
        "201":
          description: User created successfully
          schema:
            $ref: '#/definitions/internal_features_users_transport_http.CreateUserResponseDTO'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_vitaly-bogdanov_my-todo-app_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_vitaly-bogdanov_my-todo-app_internal_core_transport_http_response.ErrorResponse'
      summary: Create a new user
      tags:
      - users
  /users/{id}:
    delete:
      consumes:
      - application/json
      description: Delete user by ID
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No content
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_vitaly-bogdanov_my-todo-app_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/github_com_vitaly-bogdanov_my-todo-app_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_vitaly-bogdanov_my-todo-app_internal_core_transport_http_response.ErrorResponse'
      summary: Delete user
      tags:
      - users
    get:
      description: Get user by ID
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: User found
          schema:
            $ref: '#/definitions/internal_features_users_transport_http.GetUserRequestDTO'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_vitaly-bogdanov_my-todo-app_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/github_com_vitaly-bogdanov_my-todo-app_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_vitaly-bogdanov_my-todo-app_internal_core_transport_http_response.ErrorResponse'
      summary: Get user
      tags:
      - users
    patch:
      description: |-
        Patch user by ID

        В теле можно передать:
        - только phone_number
        - только full_name
        - phone_number и full_name

        full_name не может быть null. phone_number начинается с + и содержит от 8 до 15 цифр, первая цифра от 1 до 9.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: User patch
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_users_transport_http.PatchUserRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: User patched
          schema:
            $ref: '#/definitions/internal_features_users_transport_http.PatchUserResponseDTO'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_vitaly-bogdanov_my-todo-app_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/github_com_vitaly-bogdanov_my-todo-app_internal_core_transport_http_response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_vitaly-bogdanov_my-todo-app_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_vitaly-bogdanov_my-todo-app_internal_core_transport_http_response.ErrorResponse'
      summary: Patch user
      tags:
      - users
schemes:
- http
swagger: "2.0"
